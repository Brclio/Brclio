name = "brclio-client-services"
account_id = "cacceff607775c81f667b7a951d4639f"
main = "src/entry.js"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = false
keep_vars = true
# The isolated reproducer fails after repeated uploads of this artifact with a map.
# Explicitly omit map parts and retain all existing runtime modules.
upload_source_maps = false

[vars]
GITHUB_DATA_REPOSITORY = "BrclioData/BrclioUserData"
GITHUB_PROGRAM_DATA_REPOSITORY = "BrclioData/BrclioData"
DATA_MIGRATION_READ_ONLY = "false"

[[routes]]
pattern = "tools.brclio.com"
custom_domain = true

# Dashboard-managed Text environment variables are preserved by keep_vars.
# The owner requested values remain viewable for maintenance in the console:
# ADMIN_EMAIL, ADMIN_PASSWORD, SESSION_SECRET,
# GITHUB_DATA_REPOSITORY, GITHUB_PROGRAM_DATA_REPOSITORY,
# GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID,
# PROXY_SUBSCRIPTION_URL. GITHUB_APP_PRIVATE_KEY is a server-side Secret.
# No KV, Durable Objects, D1, R2, or paid storage resources are used.

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "LOGIN_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "UPDATE_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "CLIENT_CONFIG_LIMITER"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "1006"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "ACCOUNT_AUTH_LIMITER"
namespace_id = "1007"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ACCOUNT_EMAIL_LIMITER"
namespace_id = "1008"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "ACCOUNT_EMAIL_GLOBAL_LIMITER"
namespace_id = "1009"
simple = { limit = 30, period = 60 }

[observability]
enabled = false
