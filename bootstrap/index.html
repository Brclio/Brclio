<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
  <title>Brclio 下载器</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="renderer.js"></script>
</head>
<body>
  <header><strong>Brclio<span>.</span></strong><span>下载器 <b id="version"></b></span></header>
  <main>
    <h1 id="title" aria-live="polite">启动下载器</h1>
    <p id="detail">正在准备连接。</p>
    <progress id="bar" max="100" aria-label="任务进度"></progress>
    <div class="route"><span class="dot"></span><span id="network" role="status">正在检测系统代理</span></div>
    <label class="preference"><input id="autoSelf" type="checkbox" checked>自动更新下载器自身</label>
    <p id="preferenceError" role="alert" hidden></p>
    <p id="warning" hidden></p>
    <div class="actions">
      <button id="download" type="button" disabled>下载并安装 Brclio</button>
      <button id="upgrade" type="button" class="secondary" disabled>升级下载器</button>
      <button id="retry" type="button" class="secondary" hidden>重新尝试</button>
    </div>
  </main>
</body>
</html>
