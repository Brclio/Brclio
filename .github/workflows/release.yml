name: Read-only account Chromium runtime diagnostic
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing product version
        required: true
        default: 0.1.10
permissions:
  contents: read
jobs:
  account-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install-deps chromium
      - name: Verify real Electron gate against offline fixtures
        run: xvfb-run -a node scripts/verify-account-runtime.mjs
      - name: Verify production account boundaries through real Electron
        run: |
          mkdir -p artifacts
          xvfb-run -a node desktop/account-service-live.cjs > artifacts/account-runner-electron-ready-safe.json
      - name: Save bounded safe diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-runner-electron-ready-safe
          path: artifacts/account-runner-electron-ready-safe.json
          if-no-files-found: ignore
          retention-days: 14
