name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z matching package.json and Android versionName'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate the release version and source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) throw new Error('package.json version must be X.Y.Z.');
          const requested = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' ? process.env.REQUESTED_VERSION : process.env.GITHUB_REF_NAME.replace(/^v/, '');
          if (requested !== version) throw new Error('Requested/tag version differs from package.json.');
          const android = fs.readFileSync('android/app/build.gradle', 'utf8').match(/versionName\s+['"]([^'"]+)['"]/);
          if (!android || android[1] !== version) throw new Error('Android versionName differs from package.json.');
          const tag = `v${version}`;
          let existing;
          try { existing = execFileSync('git', ['rev-parse', '--verify', `${tag}^{commit}`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim(); } catch {}
          if (existing && existing !== process.env.GITHUB_SHA) throw new Error('The release tag already points to a different commit.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag=${tag}\n`);
          JS

  tests:
    name: Required checks
    needs: metadata
    uses: ./.github/workflows/ci.yml

  desktop:
    name: ${{ matrix.name }}
    needs: [metadata, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: win
            arch: x64
          - name: macOS Apple silicon
            runner: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sync
      - name: Check the full Xcode toolchain for FinderSync
        if: matrix.platform == 'mac'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun swiftc --version
      - name: Build Windows installer without publishing
        if: matrix.platform == 'win'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - name: Build and sign macOS installers without publishing
        if: matrix.platform == 'mac'
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --"$BUILD_ARCH" --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.notarize=false --config.forceCodeSigning=true
      - name: Verify final macOS packages and launch the packaged client
        if: matrix.platform == 'mac'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/verify-mac-package.mjs --dir release --version "$RELEASE_VERSION" --arch "$RELEASE_ARCH" --smoke --report "artifacts/mac-package-$RELEASE_ARCH.json"
      - name: Save macOS package verification report
        if: always() && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-package-verification-${{ matrix.arch }}
          path: artifacts/mac-package-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build a private older-version macOS update fixture
        if: matrix.platform == 'mac'
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --dir --"$BUILD_ARCH" --publish never --config.extraMetadata.version=0.1.2 --config.directories.output=artifacts/update-old --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.notarize=false --config.forceCodeSigning=true
      - name: Verify real macOS replacement and automatic launch
        if: matrix.platform == 'mac'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: node desktop/mac-installer-smoke.cjs --version "$RELEASE_VERSION" --report "artifacts/mac-update-$RELEASE_ARCH.json"
      - name: Save macOS native update verification report
        if: always() && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-update-verification-${{ matrix.arch }}
          path: artifacts/mac-update-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Brclio-${{ needs.metadata.outputs.version }}-windows-${{ matrix.arch }}.exe
            release/Brclio-${{ needs.metadata.outputs.version }}-mac-${{ matrix.arch }}.dmg
            release/Brclio-${{ needs.metadata.outputs.version }}-mac-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Signed Android APK
    needs: [metadata, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK and the exact build packages
        uses: android-actions/setup-android@v3
        with:
          # Command-line tools 16.0 supports the JDK 17 used by this project.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Load required release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret}" ]; then echo "Missing required signing secret: $secret" >&2; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brclio-release.jks"
          chmod 600 "$RUNNER_TEMP/brclio-release.jks"
      - name: Build and verify signed release
        working-directory: android
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/brclio-release.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          bash gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - name: Name the release APK
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Brclio-$RELEASE_VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-android
          path: release/Brclio-${{ needs.metadata.outputs.version }}-android.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/brclio-release.jks"

  publish:
    name: Publish only the complete verified release
    needs: [metadata, tests, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-files
          merge-multiple: true
      - name: Require all six installers and create SHA-256 manifest
        run: |
          node scripts/checksums.mjs release-files --version "$RELEASE_VERSION"
          node scripts/checksums.mjs release-files --version "$RELEASE_VERSION" --verify
      - name: Stage a draft release
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/brclio-release.json" 2>/dev/null; then
            node --input-type=module -e 'import fs from "node:fs"; if (!JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/brclio-release.json", "utf8")).isDraft) throw new Error("This version is already public; do not replace published updater assets. Release a new version.");'
          else
            NOTES_FILE="docs/releases/$RELEASE_TAG.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Brclio $RELEASE_VERSION" --draft --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Brclio $RELEASE_VERSION" --draft --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" release-files/* --clobber
      - name: Verify uploaded files before publication
        run: |
          gh release download "$RELEASE_TAG" --dir verify-release
          node scripts/checksums.mjs verify-release --version "$RELEASE_VERSION" --verify
          cmp release-files/SHA256SUMS.txt verify-release/SHA256SUMS.txt
      - name: Publish complete release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
