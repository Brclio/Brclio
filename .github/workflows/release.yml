name: Temporary production account readiness validation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Diagnostic version; the verifier reads package.json
        required: true
        default: '0.1.10'
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    name: Official account ready verifier on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the unmodified official ready verifier with its product identity
        shell: bash
        run: |
          set -o pipefail
          node cloudflare/scripts/verify-account-live.mjs --ready 2>&1 | tee "$RUNNER_TEMP/account-runner-official-ready-safe.json"
      - name: Save sanitized readiness results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-runner-official-ready-safe
          path: ${{ runner.temp }}/account-runner-official-ready-safe.json
          if-no-files-found: error
          retention-days: 7
