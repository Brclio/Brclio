name: Temporary account runner diagnosis

on:
  workflow_dispatch:
    inputs:
      version:
        description: Diagnostic client version; no build or publication
        required: true
        default: '0.1.10'
        type: string

permissions:
  contents: read

jobs:
  diagnostics:
    name: Read-only Ubuntu account access diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare curl and Node user agents without credentials
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {writeFile} from 'node:fs/promises';
          import path from 'node:path';
          const origin = 'https://tools.brclio.com';
          const paths = ['/api/health', '/api/account/session'];
          const knownKeys = new Set(['ok','service','proxyProtocol','user','csrf','passwordEnabled','googleEnabled','emailEnabled','error','message']);
          const results = [];
          function safeHeaders(get) {
            const server = get('server')?.toLowerCase();
            const type = get('content-type')?.split(';')[0].trim().toLowerCase();
            const ray = get('cf-ray');
            return {server: server === 'cloudflare' ? 'cloudflare' : server ? 'other' : null,
              contentType: ['application/json','text/html','text/plain'].includes(type) ? type : type ? 'other' : null,
              cfMitigated: get('cf-mitigated')?.trim().toLowerCase() === 'challenge' ? 'challenge' : get('cf-mitigated') ? 'other' : null,
              cfRay: /^[a-f0-9]{16,}-[A-Z]{3}$/.test(ray || '') ? ray : null};
          }
          function classify(body, headers) {
            if (headers.contentType === 'application/json') {
              try {
                const value = JSON.parse(body);
                if (!value || typeof value !== 'object' || Array.isArray(value)) return {bodyClass:'json_non_object'};
                const keys = Object.keys(value);
                const applicationError = new Map([
                  ['请求来源无效','origin_denied'],['请先登录','authentication_required'],
                  ['账号服务暂不可用','service_unavailable'],['请求过于频繁，请稍后重试','rate_limited']
                ]).get(value.error) || (value.error ? 'other_application_error' : null);
                return {bodyClass:'json', jsonKeys:keys.filter(key=>knownKeys.has(key)).sort(),
                  otherJsonKeyCount:keys.filter(key=>!knownKeys.has(key)).length,applicationError};
              } catch { return {bodyClass:'invalid_json'}; }
            }
            const title = /<title[^>]*>([\s\S]{0,500}?)<\/title>/i.exec(body)?.[1]?.toLowerCase() || '';
            if (headers.cfMitigated === 'challenge' || title.includes('just a moment') || body.includes('/cdn-cgi/challenge-platform/')) return {bodyClass:'cloudflare_challenge',titleClass:'challenge'};
            if (title.includes('attention required') || title.includes('access denied') || body.includes('Cloudflare Ray ID')) return {bodyClass:'cloudflare_block',titleClass:'block'};
            return {bodyClass:body.trim() ? /<html/i.test(body) ? 'other_html' : 'other_text' : 'empty',titleClass:title ? 'other' : 'absent'};
          }
          async function nodeRequest(target, explicit) {
            const response = await fetch(origin + target,{headers:{Accept:'application/json',...(explicit ? {'User-Agent':'Brclio/0.1.10'} : {})},
              credentials:'omit',redirect:'manual',cache:'no-store',signal:AbortSignal.timeout(30000)});
            const headers = safeHeaders(name=>response.headers.get(name));
            let body='',size=0;
            const reader=response.body?.getReader(),decoder=new TextDecoder();
            try {
              if(reader)while(true){const item=await reader.read();if(item.done)break;size+=item.value.byteLength;if(size>65536)return {status:response.status,...headers,bodyClass:'over_limit'};body+=decoder.decode(item.value,{stream:true});}
              body+=decoder.decode();
            } finally {await reader?.cancel().catch(()=>{});}
            return {status:response.status,...headers,...classify(body,headers)};
          }
          function curlRequest(target, explicit) {
            const request=spawnSync('curl',['--silent','--show-error','--max-time','30','--max-redirs','0','--max-filesize','65536',
              '--dump-header','/dev/stderr','--header','Accept: application/json',...(explicit ? ['--user-agent','Brclio/0.1.10'] : []),origin+target],
              {encoding:'utf8',maxBuffer:128*1024,timeout:35000});
            const blocks=(request.stderr || '').split(/\r?\n\r?\n/).filter(value=>/^HTTP\/\S+\s+\d{3}/.test(value));
            const header=blocks.at(-1)||'';
            const status=Number(/^HTTP\/\S+\s+(\d{3})/.exec(header)?.[1] || 0);
            const values=new Map(header.split(/\r?\n/).slice(1).map(line=>[line.slice(0,line.indexOf(':')).toLowerCase(),line.slice(line.indexOf(':')+1).trim()]));
            const headers=safeHeaders(name=>values.get(name));
            return {status,...headers,curlExit:request.status,errorType:request.error ? 'process_or_timeout' : null,...classify(request.stdout || '',headers)};
          }
          for(const client of ['undici','curl'])for(const explicit of [false,true])for(const target of paths){
            const record={observedAt:new Date().toISOString(),client,userAgentMode:explicit?'Brclio/0.1.10':'default',path:target};
            try{Object.assign(record,client==='undici'?await nodeRequest(target,explicit):curlRequest(target,explicit));}
            catch(error){record.errorType=['AbortError','TimeoutError'].includes(error?.name)?'timeout':'network_or_response_failure';}
            results.push(record);console.log(JSON.stringify(record));
          }
          await writeFile(path.join(process.env.RUNNER_TEMP,'account-runner-diagnostics-safe.json'),JSON.stringify({readOnly:true,runId:process.env.GITHUB_RUN_ID,
            sourceRef:process.env.GITHUB_REF,runner:'ubuntu-24.04',nodeVersion:process.version,requests:results},null,2)+'\n');
          JS
      - name: Save sanitized diagnostic results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-runner-diagnostics-safe
          path: ${{ runner.temp }}/account-runner-diagnostics-safe.json
          if-no-files-found: error
          retention-days: 7
