name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Shared core and desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Browser and native bridge contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Find the installed Playwright Chromium
        run: |
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          echo "BRCLIO_CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run sync
      - name: Verify browser UI and actual browser clipboard
        shell: bash
        run: |
          node scripts/serve.mjs > "$RUNNER_TEMP/brclio-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node scripts/verify-ui.mjs
      - run: node scripts/verify-host-contracts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install the exact Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and lint
        working-directory: android
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug
