name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  windows-shell:
    name: Windows Explorer command and identity package
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile the native DLL, sign its sparse identity, and exercise COM selection dispatch
        run: node native/windows/test.cjs
      - name: Verify registration, migration, and ownership contracts
        run: node --test desktop/windows-shell.test.cjs desktop/integration.test.cjs desktop/windows-selection.test.cjs
      - name: Verify real foreground Explorer selections and reject stale or empty views
        env:
          BRCLIO_ALLOW_SELECTION_SMOKE: '1'
        run: node desktop/windows-selection-smoke.cjs
      - name: Save native Explorer selection verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selection-verification
          path: artifacts/windows-selection-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  windows11-selection:
    name: Windows 11 active Explorer tab selection
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Windows selection parsing and compile its native interop
        run: node --test desktop/windows-selection.test.cjs
      - name: Verify real files, folders, multiple selections and active Explorer tabs
        env:
          BRCLIO_ALLOW_SELECTION_SMOKE: '1'
        run: node desktop/windows-selection-smoke.cjs
      - name: Save Windows 11 selection verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows11-selection-verification
          path: artifacts/windows-selection-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  windows-update:
    name: Windows native automatic update
    uses: ./.github/workflows/windows-update.yml

  test:
    name: Shared core and desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  browser:
    name: Browser and native bridge contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Use the official Ubuntu archive for browser and media dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
      - name: Find the installed Playwright Chromium
        run: |
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          echo "BRCLIO_CHROME=$CHROME_PATH" >> "$GITHUB_ENV"
      - run: npm run sync
      - name: Verify browser UI and actual browser clipboard
        shell: bash
        run: |
          node scripts/serve.mjs > "$RUNNER_TEMP/brclio-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node scripts/verify-ui.mjs
          node scripts/verify-account-ui.mjs
      - name: Verify XHS browser behavior and native UI contracts
        run: |
          node scripts/verify-xhs-ui.mjs
          node scripts/verify-xhs-live-import.mjs
          node scripts/verify-xhs-android-bridge.mjs
      - name: Install the independent media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle the native XHS parser used by the Electron verification
        run: npm run prepare:xhs
      - name: Verify the actual XHS Electron download pipeline and local Live Photos
        env:
          DEBUG: pw:browser
        run: |
          xvfb-run -a node scripts/verify-xhs-desktop.cjs
          xvfb-run -a node scripts/verify-xhs-live.cjs
          xvfb-run -a node scripts/verify-xhs-live-import.mjs --electron
      - run: node scripts/verify-host-contracts.mjs
      - run: node scripts/verify-update-proxy-ui.mjs
      - name: Verify native updater TLS, proxy selection, interrupted download resumption, and cancellation
        run: xvfb-run -a npm run test:native-proxy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: |
            artifacts/*.png
            artifacts/xhs-*verification.json
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android unit tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK and the exact build packages
        uses: android-actions/setup-android@v3
        with:
          # Command-line tools 16.0 supports the JDK 17 used by this project.
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Test and lint
        working-directory: android
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug

  mac-extension:
    name: FinderSync compile and sandbox signature (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the full Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun swiftc --version
      - name: Verify Finder selections and URL payloads in native Swift
        run: node native/macos/test.mjs
      - name: Compile and strictly verify the native extension
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          BUILD_VERSION="$(node -p 'require("./package.json").version')"
          node scripts/build-mac-finder-extension.mjs --arch "$BUILD_ARCH" --version "$BUILD_VERSION" --output "$RUNNER_TEMP/BrclioFinderSync.appex"

  cloudflare:
    name: Brclio client services
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
