name: Release Brclio Downloader Lite

on:
  pull_request:
    paths: ['lite/**', 'bootstrap/publish.sh', 'scripts/checksums.mjs', '.github/workflows/lite-release.yml']
  push:
    tags: ['lite-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: mac-arm64 }
          - { runner: macos-15-intel, target: mac-x64 }
          - { runner: windows-2022, target: windows-x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: lite/go.sum
      - name: Check tag and test
        shell: bash
        run: |
          cd lite
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then test "lite-v$(cat VERSION)" = "$GITHUB_REF_NAME"; fi
          go test ./...
      - name: Build
        shell: bash
        run: bash lite/tools/build.sh ${{ matrix.target }}
      - name: Verify packaged Mac version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(cat lite/VERSION)
          mount=$(mktemp -d)
          hdiutil attach release/lite/*.dmg -readonly -nobrowse -noautoopen -mountpoint "$mount" -quiet
          trap 'hdiutil detach "$mount" -quiet && rmdir "$mount"' EXIT
          bundle="$mount/Brclio Downloader Lite.app"
          codesign --verify --deep --strict "$bundle"
          "$bundle/Contents/MacOS/Brclio Downloader Lite" --version | grep -F -- "$version"
          python3 lite/tools/verify-mac-launch.py "$bundle"
      - name: Install the official Brclio DMG in an isolated Applications directory
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/Brclio/Brclio/releases/latest --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${tag#v}
          asset="Brclio-$version-$BUILD_TARGET.dmg"
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          gh release download "$tag" --repo Brclio/Brclio --dir "$temp" --pattern "$asset" --pattern SHA256SUMS.txt
          digest=$(awk -v name="$asset" '$2==name {print $1; matches++} END {if (matches != 1) exit 1}' "$temp/SHA256SUMS.txt")
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          export BRCLIO_TEST_OFFICIAL_DMG="$temp/$asset" BRCLIO_TEST_OFFICIAL_SHA="$digest" BRCLIO_TEST_OFFICIAL_VERSION="$version"
          cd lite
          go test -count=1 -v -timeout=5m -run '^TestOfficialMacReleaseInstall$' .
          python3 ../bootstrap/tools/mac-canonical-install-smoke.py lite "$BUILD_TARGET"
      - name: Verify packaged Windows version
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version=$(cat lite/VERSION)
          release/lite/*.exe --version | grep -F -- "$version"
      - name: Exercise native Windows Brclio installation, upgrade, and portable self-update
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          BRCLIO_LITE_WINDOWS_SMOKE: '1'
        run: |
          set -euo pipefail
          tag=$(gh api repos/Brclio/Brclio/releases/latest --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          for release in v0.2.7 "$tag"; do
            version=${release#v}
            gh release download "$release" --repo Brclio/Brclio --dir "$temp/$version" --pattern "Brclio-$version-windows-x64.exe" --pattern SHA256SUMS.txt
          done
          export BRCLIO_LITE_TEST_RELEASES=$(cygpath -aw "$temp")
          export BRCLIO_LITE_TEST_LATEST=${tag#v}
          export BRCLIO_LITE_TEST_EXE=$(cygpath -aw "release/lite/Brclio-Downloader-Lite-$(cat lite/VERSION)-windows-x64.exe")
          cd lite
          go test -count=1 -timeout=10m -v -run '^TestWindows(PublicBrclioInstallAndUpgrade|PortableSelfHandoff)$' .
      - uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.target }}
          path: |
            release/lite/*.exe
            release/lite/*.dmg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: brclio-lite-release-channel
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: lite-*
          path: release-files
          merge-multiple: true
      - run: bash bootstrap/publish.sh lite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
