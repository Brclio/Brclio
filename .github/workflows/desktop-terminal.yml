name: Desktop terminal

on:
  push:
    paths:
      - '.github/workflows/desktop-terminal.yml'
      - 'desktop/terminal/**'
      - 'desktop/terminal-*.test.cjs'
      - 'desktop/main.cjs'
      - 'desktop/preload.cjs'
      - 'web/app.js'
      - 'web/index.html'
      - 'web/styles.css'
      - 'web/terminal-workspace.*'
      - 'scripts/*after-pack.cjs'
      - 'scripts/terminal-*.cjs'
      - 'scripts/terminal-*.py'
      - 'scripts/verify-terminal.cjs'
      - 'scripts/verify-terminal-*.cjs'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Existing client regression checks
    if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    uses: ./.github/workflows/ci.yml

  packaged-terminal:
    name: Packaged terminal on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: win
            arch: x64
            executable: release/win-unpacked/Brclio.exe
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
            executable: release/mac/Brclio.app/Contents/MacOS/Brclio
          - name: macOS Apple silicon
            runner: macos-15
            platform: mac
            arch: arm64
            executable: release/mac-arm64/Brclio.app/Contents/MacOS/Brclio
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build and exercise the Windows Hello desktop ABI
        if: matrix.platform == 'win'
        run: node desktop/terminal/windows-hello/build.cjs
      - run: npm ci --prefix cloudflare
      - name: Provide tmux for native control-mode tests
        if: matrix.platform == 'mac'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: command -v tmux || brew install tmux
      - name: Provide a local SFTP server for Windows file-transfer tests
        if: matrix.platform == 'win'
        shell: powershell
        run: |
          $server = Join-Path $env:SystemRoot 'System32/OpenSSH/sftp-server.exe'
          if (!(Test-Path $server)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction Stop
          }
          if (!(Test-Path $server)) { throw 'The native Windows SFTP subsystem is unavailable.' }
      - run: npm run sync
      - name: Run terminal unit and protocol tests
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          files=()
          for file in desktop/terminal-*.test.cjs; do
            if [[ "$file" != "desktop/terminal-sftp.test.cjs" ]]; then files+=("$file"); fi
          done
          node --test "${files[@]}"
      - name: Verify native SFTP file operations and cancellation
        run: node --test desktop/terminal-sftp.test.cjs
        timeout-minutes: 4
      - name: Verify local-only mode, two-account isolation and two-device sync
        run: |
          node scripts/verify-terminal-sync.cjs
          node scripts/verify-terminal-account-switch.cjs
          node scripts/verify-terminal-shared-vaults.cjs
          node scripts/verify-terminal-snippet-sync.cjs
          node scripts/verify-terminal-command-suggest.cjs
          node scripts/verify-terminal-arrangement-hosts.cjs
          node scripts/verify-terminal-live-view.cjs
          node scripts/verify-terminal-lock.cjs
          node scripts/verify-terminal-local-logs.cjs
      - name: Exercise the graphical file browser with the local SFTP subsystem
        run: node scripts/verify-terminal-sftp.cjs
      - run: npm run prepare:xhs
      - name: Build the regular application for isolated regression testing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
      - name: Run commands in the packaged terminal
        timeout-minutes: 7
        env:
          BRCLIO_SMOKE_EXECUTABLE: ${{ matrix.executable }}
        run: node scripts/verify-terminal.cjs
      - name: Verify opt-in account-local logs in the packaged terminal
        timeout-minutes: 3
        env:
          BRCLIO_SMOKE_EXECUTABLE: ${{ matrix.executable }}
        run: node scripts/verify-terminal-local-logs.cjs
      - name: Provide tmux inside WSL for Windows control-mode tests
        if: matrix.platform == 'win'
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Alpine-3.22
          wsl-version: '1'
          additional-packages: tmux
          set-as-default: 'true'
          use-cache: 'false'
      - name: Exercise the packaged tmux control-mode workspace
        timeout-minutes: 3
        env:
          BRCLIO_SMOKE_EXECUTABLE: ${{ matrix.executable }}
        run: node scripts/verify-terminal-tmux.cjs
      - name: Verify status components across packaged app restarts
        timeout-minutes: 4
        env:
          BRCLIO_SMOKE_EXECUTABLE: ${{ matrix.executable }}
        run: node scripts/verify-terminal-status.cjs
      - name: Build and verify an isolated terminal preview
        id: preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node scripts/terminal-preview-build.cjs
      - name: Save the portable preview
        uses: actions/upload-artifact@v4
        with:
          name: terminal-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ steps.preview.outputs.archive }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Verify the development build after packaging
        timeout-minutes: 7
        run: node scripts/verify-terminal.cjs
