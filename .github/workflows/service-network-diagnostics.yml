name: Service network diagnostics

on:
  push:
    branches: [codex/service-network-diagnostics]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare four bounded production responses without secrets or raw bodies
        run: node scripts/service-network-diagnostics.mjs
      - name: Upload sanitized response diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-network-diagnostics
          path: artifacts/service-network-diagnostics.json
          if-no-files-found: error
          retention-days: 3
